name: Build desktop (mac / win / linux)

# Manual runs produce downloadable artifacts; pushing a tag like v0.7.7 also attaches the installers
# to a GitHub Release. Each runner builds its OWN platform natively and jlinks its OWN bundled JRE into
# resources/jre (gitignored), so the extraResources mapping (resources/jre -> jre) needs no change.
# Same shape as minimacore-desktop's workflow, plus: fetch the (gitignored, 69 MB) classic jar and
# build the Vite renderer before packaging.
#
# SIGNING + NOTARIZATION (wired; dormant until the repo secrets exist — without them the mac build is
# unsigned and Gatekeeper wants right-click → Open):
#   MAC_CERT_P12        base64 of the "Developer ID Application" certificate exported as .p12
#   MAC_CERT_PASSWORD   the .p12 password
#   APPLE_ID            the Apple ID that owns the Developer Program membership
#   APPLE_APP_SPECIFIC_PASSWORD   an app-specific password from appleid.apple.com (NOT the account password)
#   APPLE_TEAM_ID       the 10-character Team ID (Z4JD286WF4)
# electron-builder reads CSC_LINK / CSC_KEY_PASSWORD to sign (hardened runtime + entitlements) and the
# APPLE_* vars to notarize and staple; the Verify step then proves Gatekeeper accepts the result.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for the tag build to create the GitHub Release

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            ebflag: --mac --arm64
          - os: windows-latest
            platform: win
            ebflag: --win
          - os: ubuntu-latest
            platform: linux
            ebflag: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # minima.jar is Java 8 bytecode, so any modern JRE runs it. Temurin 21 LTS is
      # available on all three runners; we jlink a minimal JRE from it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build bundled JRE (jlink)
        shell: bash
        run: |
          jlink \
            --add-modules java.se,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output resources/jre
          ls resources/jre/bin

      - name: Fetch the full classic minima.jar (MDS + Maxima)
        shell: bash
        run: ./scripts/fetch-jar.sh

      - name: Install deps
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.ebflag }} --publish never

      # Prove the mac build is what Gatekeeper wants: Developer ID signature, hardened runtime, notarization
      # ticket stapled to the DMG. Only meaningful once the signing secrets exist.
      - name: Verify signature + notarization (mac)
        if: matrix.platform == 'mac' && env.CERT != ''
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
        run: scripts/verify-mac.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimadesk-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MinimaClassic Desktop ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
